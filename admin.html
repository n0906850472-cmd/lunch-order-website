<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>管理後台｜中餐訂購</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div><p class="eyebrow">ADMIN CONSOLE</p><h1>訂餐管理後台</h1></div><a class="text-link" href="index.html">回到前台</a></header><main class="container admin-container"><div id="admin-notice" class="notice hidden"></div>
  <section id="login-view" class="auth-card"><p class="eyebrow">SECURE LOGIN</p><h2>管理員登入</h2><p class="muted">只有管理員可以查看訂單與管理菜單。</p><form id="login-form"><label>Email<input name="email" type="email" required></label><label>密碼<input name="password" type="password" required minlength="6"></label><button class="primary full">登入</button></form></section>
  <section id="dashboard" class="hidden"><div class="dashboard-top"><div><p class="eyebrow">DASHBOARD</p><h2>午餐營運總覽</h2><p id="admin-email" class="muted"></p></div><button id="logout" class="secondary">登出</button></div>
    <div class="stats"><div><span>今日訂單</span><strong id="stat-orders">0</strong></div><div><span>今日金額</span><strong id="stat-total">NT$ 0</strong></div><div><span>待處理</span><strong id="stat-pending">0</strong></div></div>
    <div class="admin-tabs"><button class="tab active" data-tab="orders">訂單管理</button><button class="tab" data-tab="menu-admin">餐點管理</button><button class="tab super-only" data-tab="users">管理員</button></div>
    <section id="orders-tab" class="tab-content"><div class="toolbar"><div><label>取餐日期 <input id="admin-date" type="date"></label></div><select id="status-filter"><option value="">全部狀態</option><option value="pending">待處理</option><option value="preparing">製作中</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></div><div class="table-wrap"><table><thead><tr><th>訂單編號</th><th>顧客</th><th>部門</th><th>餐點</th><th>金額</th><th>狀態</th><th>操作</th></tr></thead><tbody id="orders-table"></tbody></table></div></section>
    <section id="menu-admin-tab" class="tab-content hidden"><div class="toolbar"><h3>餐點列表</h3><button id="add-menu" class="primary">新增餐點</button></div><div id="menu-admin-list" class="admin-menu-list"></div></section>
    <section id="users-tab" class="tab-content hidden super-only"><div class="toolbar"><h3>管理員帳號</h3><button id="add-user" class="primary">新增管理員</button></div><div id="users-list" class="admin-menu-list"></div></section>
  </section></main>
  <div id="menu-modal" class="modal hidden"><div class="modal-card"><button class="modal-close" data-close="menu-modal">×</button><h2 id="menu-modal-title">新增餐點</h2><form id="menu-form"><input type="hidden" name="id"><label>餐點名稱<input name="name" required maxlength="80"></label><label>價格<input name="price" type="number" min="0" required></label><label>分類<input name="category" maxlength="40" value="便當"></label><label>圖片網址（選填）<input name="image_url" type="url"></label><label>餐點說明<textarea name="description" rows="3"></textarea></label><label class="check"><input name="is_available" type="checkbox" checked> 上架販售</label><button class="primary full">儲存餐點</button></form></div></div>
  <div id="user-modal" class="modal hidden"><div class="modal-card"><button class="modal-close" data-close="user-modal">×</button><h2>新增管理員</h2><form id="user-form"><label>Email<input name="email" type="email" required></label><label>初始密碼<input name="password" type="password" minlength="6" required></label><label>角色<select name="role"><option value="admin">一般管理員</option><option value="super_admin">超級管理者</option></select></label><button class="primary full">建立帳號</button></form><p class="small muted">建立後請通知管理員使用此 Email 登入。</p></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script type="module" src="admin.js"></script>
</body></html>
