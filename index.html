<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中餐訂購</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><div><p class="eyebrow">LUNCH ORDER</p><h1>中餐訂購</h1></div><a class="text-link" href="admin.html">管理後台</a></header>
  <main class="container">
    <section class="hero"><div><h2>提前訂餐，到店取餐</h2><p>請選擇取餐日期與餐點。每日取餐日 11:30 截止接單。</p></div><div class="hero-badge">免登入<br><strong>快速下單</strong></div></section>
    <div id="notice" class="notice hidden"></div>
    <section class="order-layout">
      <div><div class="section-heading"><h2>選擇餐點</h2><label>取餐日期 <input id="pickup-date" type="date"></label></div><div id="menu" class="menu-grid"><div class="loading">載入餐點中…</div></div></div>
      <aside class="cart-panel"><div class="section-heading"><h2>你的訂單</h2><span id="cart-count">0 項</span></div><div id="cart-items" class="cart-items"><p class="muted">尚未選擇餐點</p></div><div class="total-row"><span>總金額</span><strong id="cart-total">NT$ 0</strong></div>
        <form id="order-form"><h3>取餐資料</h3><label>姓名<input name="name" required maxlength="40"></label><label>電話<input name="phone" required maxlength="30" inputmode="tel"></label><label>部門<select name="department" required><option value="">請選擇部門</option><option>行政部</option><option>業務部</option><option>財務部</option><option>人資部</option><option>資訊部</option><option>其他</option></select></label><label>備註（選填）<textarea name="note" rows="2" maxlength="200"></textarea></label><button class="primary full" type="submit">送出訂單</button></form>
      </aside>
    </section>
  </main>
  <div id="success-modal" class="modal hidden"><div class="modal-card"><button class="modal-close" id="close-modal">×</button><p class="eyebrow">ORDER RECEIVED</p><h2>訂單已送出</h2><p>請記下你的訂單編號，到店取餐時出示即可。</p><div id="order-number" class="order-number"></div><button class="primary full" id="new-order">再訂一筆</button></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script type="module" src="app.js"></script>
</body></html>
